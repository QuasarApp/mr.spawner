name: CMake Release Builder
on:
  push:
    tags:
      - 'v*' # This will trigger the workflow on any tag starting with 'v', like v1.0.0, v2.1, etc.
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations.
      fail-fast: false

      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
        build_type: [Release]
        c_compiler: [gcc]

    steps:
    # Checkout main repository with submodules
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-tags: true
        fetch-depth: 0

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Install CQtDeployer
      # The deploy target creates the distribution packages via CQtDeployer.
      uses: QuasarApp/cqtdeployer-install-action@main
      with:
        latest: true

    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ matrix.os }}-${{ matrix.type }}

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -G Ninja
        -DMRSPAWNER_TESTS=OFF
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Configure CMake (Linux)
      if: runner.os == 'Linux'
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -G Ninja
        -DMRSPAWNER_TESTS=OFF
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Configure CMake (macOS)
      if: runner.os == 'macOS'
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -G Ninja
        -DMRSPAWNER_TESTS=OFF
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --parallel 16

    - name: deploy
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --target deploy --parallel 1

    - name: Create Release and Upload Assets zip
      uses: svenstaro/upload-release-action@v2
      with:
        tag: v${{ env.MRSPAWNER_VERSION }}
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: Distro/${{ env.MRSPAWNER_DISTRO_FULL_NAME }}.zip
        asset_name: ${{ env.MRSPAWNER_DISTRO_FULL_NAME }}.zip
        prerelease: true
        overwrite: true
        target_commit: ${{ github.head_ref }}
        body: Mr.Spawner ${{ env.MRSPAWNER_VERSION }}

    - name: Create Release and Upload Assets Deb
      if: runner.os == 'Linux'
      uses: svenstaro/upload-release-action@v2
      with:
        tag: v${{ env.MRSPAWNER_VERSION }}
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: Distro/${{ env.MRSPAWNER_DISTRO_FULL_NAME }}.deb
        asset_name: ${{ env.MRSPAWNER_DISTRO_FULL_NAME }}.deb
        prerelease: true
        overwrite: true
        target_commit: ${{ github.head_ref }}
        body: Mr.Spawner ${{ env.MRSPAWNER_VERSION }}

    - name: Create Release and Upload Assets DMG (macOS)
      if: runner.os == 'macOS'
      uses: svenstaro/upload-release-action@v2
      with:
        tag: v${{ env.MRSPAWNER_VERSION }}
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: Distro/${{ env.MRSPAWNER_DISTRO_FULL_NAME }}.dmg
        asset_name: ${{ env.MRSPAWNER_DISTRO_FULL_NAME }}.dmg
        prerelease: true
        overwrite: true
        target_commit: ${{ github.head_ref }}
        body: Mr.Spawner ${{ env.MRSPAWNER_VERSION }}
